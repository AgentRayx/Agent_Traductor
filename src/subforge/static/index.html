<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>subtitle-forge</title>
<style>
  :root{--bg:#fff;--fg:#1a1a1a;--mut:#666;--bd:#c9c9c9;--ac:#2b6cb0}
  @media(prefers-color-scheme:dark){:root{--bg:#16181c;--fg:#e8e8e8;--mut:#9a9a9a;--bd:#444;--ac:#63a4ff}}
  body{font:16px system-ui,sans-serif;background:var(--bg);color:var(--fg);max-width:560px;margin:2rem auto;padding:0 16px}
  h1{font-size:1.4rem;margin:0 0 .25rem} p.s{color:var(--mut);margin:0 0 1rem;font-size:.9rem}
  nav{display:flex;gap:.25rem;border-bottom:1px solid var(--bd);margin-bottom:1rem}
  nav button{width:auto;margin:0;background:none;color:var(--mut);border:0;border-bottom:2px solid transparent;border-radius:0;padding:.5rem .8rem}
  nav button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--ac)} nav button:disabled{opacity:.45;cursor:not-allowed}
  section[hidden]{display:none}
  .drop{border:2px dashed var(--bd);border-radius:10px;padding:2rem 1rem;text-align:center;cursor:pointer}
  .drop.over{border-color:var(--ac)} label{display:block;margin:.9rem 0 .25rem;font-size:.9rem}
  select,button{font:inherit;padding:.5rem;width:100%;box-sizing:border-box;border-radius:6px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)}
  .row{display:flex;gap:.75rem}.row>div{flex:1}
  .go{background:var(--ac);color:#fff;border:0;margin-top:1.2rem;cursor:pointer} .go:disabled{opacity:.5;cursor:wait}
  .msg{margin-top:1rem;min-height:1.4em;font-size:.9rem;white-space:pre-wrap} .err{color:#d33}
</style>
</head>
<body>
<h1>subtitle-forge</h1>
<p class="s">Todo se procesa en este equipo; nada se sube a servidores. / Everything runs on this machine.</p>
<nav role="tablist">
  <button role="tab" id="t-video" aria-selected="true" data-tab="video">Vídeo</button>
  <button role="tab" id="t-doc" aria-selected="false" data-tab="doc">Documento</button>
  <button role="tab" id="t-manga" aria-selected="false" data-tab="manga">Manga</button>
</nav>

<section id="video" data-endpoint="/api/subtitles" data-accept="video/*,audio/*">
  <div class="drop" tabindex="0">Arrastrá un vídeo aquí o hacé clic / Drop a video here or click<br><b class="fname"></b></div>
  <input class="file" type="file" accept="video/*,audio/*" hidden>
  <label>Idioma destino / Target language</label><select class="tr"></select>
  <div class="row">
    <div><label>Formato</label><select class="fmt"><option>srt</option><option>vtt</option></select></div>
    <div><label>Modelo</label><select class="model"><option>base</option><option>small</option><option>medium</option></select></div>
  </div>
  <button class="go" disabled>Generar y descargar / Generate &amp; download</button><div class="msg" role="status"></div>
</section>

<section id="doc" hidden data-endpoint="/api/document">
  <div class="drop" tabindex="0">Arrastrá un PDF aquí o hacé clic / Drop a PDF here or click<br><b class="fname"></b></div>
  <input class="file" type="file" accept="application/pdf,.pdf" hidden>
  <label>Idioma destino / Target language</label><select class="tr" data-required="1"></select>
  <label>Formato</label>
  <select class="fmt"><option value="epub" selected>EPUB (recomendado)</option>
    <option value="md">Markdown (recomendado)</option>
    <option value="pdf-clean">PDF solo traducción (experimental)</option>
    <option value="pdf-bilingual">PDF bilingüe: original gris + traducción (experimental)</option></select>
  <label class="chk"><input type="checkbox" class="mixed"> Documento de idioma mixto: traducir solo lo que no esté en el idioma destino</label>
  <button class="go" disabled>Traducir y descargar / Translate &amp; download</button><div class="msg" role="status"></div>
</section>

<section id="manga" hidden data-endpoint="/api/manga">
  <div class="drop" tabindex="0">Arrastrá una imagen o .cbz / Drop an image or .cbz<br><b class="fname"></b></div>
  <input class="file" type="file" accept="image/*,.cbz" hidden>
  <label>Idioma destino / Target language</label><select class="tr" data-required="1"></select>
  <button class="go" disabled>Traducir y descargar / Translate &amp; download</button><div class="msg" role="status"></div>
</section>

<script>
const $=(r,s)=>r.querySelector(s);
const tabs=['video','doc','manga'];
function show(name){tabs.forEach(t=>{document.getElementById(t).hidden=t!==name;
  document.getElementById('t-'+t).setAttribute('aria-selected',t===name)})}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.tab));

fetch('/api/languages').then(r=>r.json()).then(l=>document.querySelectorAll('.tr').forEach(sel=>{
  for(const [k,v] of Object.entries(l)){ if(k===''&&sel.dataset.required) continue; sel.add(new Option(v,k)) }
  if(sel.dataset.required) sel.value='es'; }));
fetch('/api/capabilities').then(r=>r.json()).then(c=>{
  if(!c.manga){const b=document.getElementById('t-manga');b.disabled=true;
    b.title='Backend no instalado / not installed';
    const s=document.getElementById('manga');s.innerHTML='<p>Backend opcional no instalado.</p><pre class="msg">'+c.manga_help.replace(/</g,'&lt;')+'</pre>'}});

document.querySelectorAll('section').forEach(sec=>{
  let file=null;const drop=$(sec,'.drop'),input=$(sec,'.file'),go=$(sec,'.go'),msg=$(sec,'.msg');
  if(!go) return;
  const pick=f=>{file=f;$(sec,'.fname').textContent=f?f.name:'';go.disabled=!f};
  drop.onclick=()=>input.click();
  input.onchange=e=>pick(e.target.files[0]);
  drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};
  drop.ondragleave=()=>drop.classList.remove('over');
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');pick(e.dataTransfer.files[0])};
  go.onclick=async()=>{
    const fd=new FormData();fd.append('file',file);
    const tr=$(sec,'.tr'),fmt=$(sec,'.fmt'),model=$(sec,'.model');
    if(tr)fd.append('translate',tr.value); if(fmt)fd.append('format',fmt.value); if(model)fd.append('model',model.value);
    const mx=$(sec,'.mixed'); if(mx&&mx.checked)fd.append('mixed','true');
    go.disabled=true;msg.className='msg';msg.textContent='Procesando… puede tardar / Working…';
    try{
      const r=await fetch(sec.dataset.endpoint,{method:'POST',body:fd});
      if(!r.ok){let m=r.statusText;try{m=(await r.json()).detail||m}catch{};throw new Error(m)}
      const name=/filename="([^"]+)"/.exec(r.headers.get('Content-Disposition')||'')?.[1]||'result';
      const url=URL.createObjectURL(await r.blob());const a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);
      msg.textContent='Listo / Done: '+name;
      const notes=r.headers.get('X-Notes'); if(notes)msg.textContent+=' — '+decodeURIComponent(notes);
    }catch(e){msg.className='msg err';msg.textContent='Error: '+e.message}
    go.disabled=!file;
  };
});
</script>
</body>
</html>
